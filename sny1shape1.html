<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一年级科学：魔法基本形状大冒险</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    body { background: #0f0c1b; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 15px; }

    /* 计分板 */
    .scoreboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 900px; margin-bottom: 10px; }
    .team-card { background: rgba(255,255,255,0.05); border: 1px solid #ffd700; border-radius: 12px; padding: 10px; text-align: center; }
    .team-name { font-size: 14px; color: #ffe600; font-weight: bold; margin-bottom: 4px; }
    .team-score { font-size: 22px; font-weight: bold; color: #00f3ff; text-shadow: 0 0 8px #00f3ff; }
    .score-btn { border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; margin: 2px; }
    .add-btn { background: #00e676; color: #000; }
    .sub-btn { background: #ff1744; color: #fff; }

    /* 主卡片区 */
    .main-card { background: rgba(255,255,255,0.03); border: 2px solid #8a2be2; border-radius: 20px; width: 100%; max-width: 900px; min-height: 420px; padding: 20px; box-shadow: 0 0 20px rgba(138,43,226,0.3); text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .level-tag { background: #d500f9; color: #fff; display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 15px; }
    .question-title { font-size: 24px; color: #ffe600; text-shadow: 0 0 10px rgba(255,230,0,0.5); margin-bottom: 15px; line-height: 1.4; }

    /* 图形展示区 */
    .svg-container { border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; padding: 10px; margin: 0 auto 15px; max-width: 500px; width: 100%; min-height: 120px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); }

    /* 选项网格 */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 700px; margin: 0 auto; }
    .option-btn { background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); border-radius: 15px; padding: 15px; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .option-btn.correct { background: #00e676 !important; border-color: #00e676 !important; color: #000 !important; font-size: 22px; }

    /* 控制栏 */
    .controls { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 900px; margin-top: 10px; gap: 10px; }
    .action-btn { border: none; padding: 10px 18px; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
    .action-btn:active { transform: scale(0.95); }
    .nav-btn { background: #6200ea; color: #fff; }
    .timer-btn { background: #ff9100; color: #000; }
    .reveal-btn { background: #00b0ff; color: #000; }

    /* 倒计时浮层 */
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    .countdown-text { font-size: 110px; color: #ffe600; font-weight: bold; }
  </style>
</head>
<body>

  <!-- 计分板 -->
  <div class="scoreboard">
    <div class="team-card"><div class="team-name">第一组</div><div class="team-score" id="score-0">0分</div><button class="score-btn add-btn" onclick="addScore(0)">+10分</button><button class="score-btn sub-btn" onclick="subScore(0)">-10分</button></div>
    <div class="team-card"><div class="team-name">第二组</div><div class="team-score" id="score-1">0分</div><button class="score-btn add-btn" onclick="addScore(1)">+10分</button><button class="score-btn sub-btn" onclick="subScore(1)">-10分</button></div>
    <div class="team-card"><div class="team-name">第三组</div><div class="team-score" id="score-2">0分</div><button class="score-btn add-btn" onclick="addScore(2)">+10分</button><button class="score-btn sub-btn" onclick="subScore(2)">-10分</button></div>
    <div class="team-card"><div class="team-name">第四组</div><div class="team-score" id="score-3">0分</div><button class="score-btn add-btn" onclick="addScore(3)">+10分</button><button class="score-btn sub-btn" onclick="subScore(3)">-10分</button></div>
  </div>

  <!-- 主卡片 -->
  <div class="main-card" id="main-card">
    <!-- 内容由 JS 动态渲染 -->
  </div>

  <!-- 底部导航栏 -->
  <div class="controls">
    <button class="action-btn nav-btn" onclick="prevSlide()">← 上一页</button>
    <span style="font-weight: bold; font-size: 16px;" id="page-num">1 / 13</span>
    <button class="action-btn timer-btn" onclick="startTimer()">⏱️ 倒计时举牌！</button>
    <button class="action-btn reveal-btn" onclick="revealAnswer()">🪄 揭晓答案</button>
    <button class="action-btn nav-btn" onclick="nextSlide()">下一页 →</button>
  </div>

  <!-- 倒计时遮罩层 -->
  <div class="overlay" id="timer-overlay">
    <div style="font-size: 28px; color: #fff; margin-bottom: 20px;">准备好手中的形状牌...</div>
    <div class="countdown-text" id="countdown-num">3</div>
  </div>

  <script>
    let scores = [0, 0, 0, 0];
    let currentSlide = 7; // 默认跳转到图片对应的第8页 (index 7)

    const slides = [
      { tag: "第一关：认识魔法图形", q: "请找出下面的基本形状：正方形", svg: `<svg width="100" height="100"><rect x="10" y="10" width="80" height="80" fill="#ff4081"/></svg>`, options: ["正方形", "长方形", "三角形", "圆形"], correct: 0 },
      { tag: "第一关：认识魔法图形", q: "请找出下面的基本形状：圆形", svg: `<svg width="100" height="100"><circle cx="50" cy="50" r="40" fill="#00e676"/></svg>`, options: ["正方形", "三角形", "圆形", "长方形"], correct: 2 },
      { tag: "第一关：认识魔法图形", q: "请找出下面的基本形状：三角形", svg: `<svg width="100" height="100"><polygon points="50,10 10,90 90,90" fill="#00b0ff"/></svg>`, options: ["圆形", "三角形", "正方形", "长方形"], correct: 1 },
      { tag: "第二关：特征大解密", q: "“我没有角，只有一条曲边，我是谁？”", svg: `<svg width="100" height="100"><circle cx="50" cy="50" r="40" fill="none" stroke="#ffe600" stroke-width="4"/></svg>`, options: ["正方形", "长方形", "三角形", "圆形"], correct: 3 },
      { tag: "第二关：特征大解密", q: "“我有 3 条直边，3 个角，我是谁？”", svg: `<svg width="100" height="100"><polygon points="50,10 10,90 90,90" fill="none" stroke="#ffe600" stroke-width="4"/></svg>`, options: ["三角形", "正方形", "圆形", "长方形"], correct: 0 },
      { tag: "第二关：特征大解密", q: "“我有 4 条直边，4 个角，而且 4 条边都一样长，我是谁？”", svg: `<svg width="100" height="100"><rect x="15" y="15" width="70" height="70" fill="none" stroke="#ffe600" stroke-width="4"/></svg>`, options: ["长方形", "正方形", "圆形", "三角形"], correct: 1 },
      { tag: "第二关：特征大解密 (Q7)", q: "魔法车轮是什么形状的？", svg: `<svg width="100" height="100"><circle cx="50" cy="50" r="35" fill="none" stroke="#ff00ff" stroke-width="6"/><circle cx="50" cy="50" r="10" fill="#ff00ff"/></svg>`, options: ["正方形", "长方形", "三角形", "圆形"], correct: 3 },
      { 
        tag: "第二关：形状特征大解密 (Q8)", 
        q: "“我有 4 条直边，相对的两条边一样长（2长2短），我是谁？”", 
        svg: `<svg width="220" height="100"><rect x="20" y="20" width="180" height="60" fill="none" stroke="#ffe600" stroke-width="4"/><text x="110" y="15" fill="#00b0ff" font-size="12" text-anchor="middle">长边</text><text x="110" y="95" fill="#00b0ff" font-size="12" text-anchor="middle">长边</text><text x="8" y="55" fill="#ff4081" font-size="12" text-anchor="middle">短</text><text x="212" y="55" fill="#ff4081" font-size="12" text-anchor="middle">短</text></svg>`, 
        options: ["正方形", "长方形", "三角形", "圆形"], 
        correct: 1 
      },
      { tag: "第三关：生活中的形状", q: "切开的西瓜块通常像什么形状？", svg: `<svg width="100" height="100"><polygon points="50,15 15,85 85,85" fill="#ff1744"/></svg>`, options: ["三角形", "圆形", "正方形", "长方形"], correct: 0 },
      { tag: "第三关：生活中的形状", q: "黑板的表面通常是什么形状？", svg: `<svg width="140" height="80"><rect x="10" y="10" width="120" height="60" fill="#00e676"/></svg>`, options: ["正方形", "圆形", "长方形", "三角形"], correct: 2 },
      { tag: "终极挑战", q: "数一数：魔法房子屋顶是什么形状？", svg: `<svg width="120" height="100"><polygon points="60,10 10,50 110,50" fill="#ff9100"/><rect x="20" y="50" width="80" height="45" fill="#d500f9"/></svg>`, options: ["正方形", "三角形", "长方形", "圆形"], correct: 1 },
      { tag: "终极挑战", q: "数一数：魔法房子的墙壁是什么形状？", svg: `<svg width="120" height="100"><polygon points="60,10 10,50 110,50" fill="#ff9100"/><rect x="20" y="50" width="80" height="45" fill="#d500f9"/></svg>`, options: ["长方形", "圆形", "正方形", "三角形"], correct: 0 },
      { tag: "大满贯", q: "恭喜所有小魔法师完成挑战！", svg: `<svg width="100" height="100"><text x="50" y="60" font-size="50" text-anchor="middle">🏆</text></svg>`, options: ["重新挑战", "完美通关"], correct: 1 }
    ];

    function renderSlide() {
      const slide = slides[currentSlide];
      const container = document.getElementById('main-card');
      
      let optionsHTML = slide.options.map((opt, i) => 
        `<button class="option-btn" id="opt-${i}" onclick="checkAns(${i})">${opt}</button>`
      ).join('');

      container.innerHTML = `
        <div><span class="level-tag">${slide.tag}</span></div>
        <h2 class="question-title">${slide.q}</h2>
        <div class="svg-container">${slide.svg}</div>
        <div class="options-grid">${optionsHTML}</div>
      `;

      document.getElementById('page-num').innerText = `${currentSlide + 1} / ${slides.length}`;
    }

    function checkAns(index) {
      if (index === slides[currentSlide].correct) {
        document.getElementById(`opt-${index}`).classList.add('correct');
      }
    }

    function revealAnswer() {
      const correctIdx = slides[currentSlide].correct;
      document.getElementById(`opt-${correctIdx}`).classList.add('correct');
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function addScore(t) { scores[t] += 10; document.getElementById(`score-${t}`).innerText = scores[t] + '分'; }
    function subScore(t) { scores[t] = Math.max(0, scores[t] - 10); document.getElementById(`score-${t}`).innerText = scores[t] + '分'; }

    function startTimer() {
      const overlay = document.getElementById('timer-overlay');
      const numDisplay = document.getElementById('countdown-num');
      overlay.style.display = 'flex';
      let count = 3;
      numDisplay.innerText = count;

      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          numDisplay.innerText = count;
        } else if (count === 0) {
          numDisplay.innerText = "举牌！";
        } else {
          clearInterval(interval);
          overlay.style.display = 'none';
        }
      }, 1000);
    }

    // 初始化渲染
    renderSlide();
  </script>
</body>
</html>
